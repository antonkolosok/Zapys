name: Native checks

on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Verify required SDK files
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Unit tests, lint and both debug APKs
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: zapys-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Verify SDK and prepare wrapper
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          chmod +x android/gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Synthetic SQLite and interaction fixtures
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./android/gradlew -p android --no-daemon connectedDebugAndroidTest
      - name: Instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  ios-core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Toolchain evidence
        run: |
          xcodebuild -version
          swift --version
      - name: Swift domain and real SQLite tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path ios 2>&1 | tee swift-test.log
      - name: Swift test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-log
          path: swift-test.log
          if-no-files-found: warn
          retention-days: 14

  ios-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: iPhone simulator build and UI tests
        run: bash scripts/test-ios.sh
      - name: Build ARM simulator bundle for Appetize
        run: bash scripts/build-appetize-ios.sh
      - name: Appetize iPhone bundle
        uses: actions/upload-artifact@v7
        with:
          name: zapys-ios-appetize
          path: artifacts/appetize-ios-*/Zapys.app.zip
          if-no-files-found: error
          retention-days: 14
      - name: Simulator test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-results
          path: |
            artifacts/ios-*/xcodebuild.log
            artifacts/ios-*/tests.xcresult
            artifacts/appetize-ios-*/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
