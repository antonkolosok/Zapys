<div id="zapys-calendar-preview" class="viz-dotted-background" lang="uk">
  <div class="zp-app">
    <section id="zp-calendar-view">
      <header class="zp-top">
        <div class="zp-brand"><span class="zp-logo" aria-hidden="true">z</span><span>zapys</span></div>
        <span class="zp-caption">Мій календар</span>
      </header>
      <div class="zp-monthbar">
        <h2 id="zp-month"></h2>
        <div class="zp-navigation"><button type="button" id="zp-prev" aria-label="Попередній тиждень">‹</button><button type="button" id="zp-today">Сьогодні</button><button type="button" id="zp-next" aria-label="Наступний тиждень">›</button></div>
      </div>
      <div id="zp-week" class="zp-week" aria-label="Дні тижня"></div>
      <div class="zp-dayheading"><h3 id="zp-day-title"></h3><span class="zp-caption">День</span></div>
      <div id="zp-selection" class="zp-selection" hidden>
        <div><strong id="zp-selection-title"></strong><span id="zp-selection-time"></span></div>
        <button type="button" id="zp-edit-selection" class="zp-small-button">Заповнити</button>
        <button type="button" id="zp-remove-selection" class="zp-icon-button" aria-label="Видалити вибраний візит">×</button>
      </div>
      <div id="zp-timeline" class="zp-timeline" aria-label="Денний календар">
        <div id="zp-hours" class="zp-hours" aria-hidden="true"></div>
        <div id="zp-grid" class="zp-grid"><div id="zp-slots"></div><div id="zp-events" class="zp-events"></div></div>
      </div>
      <footer class="zp-footer"><button type="button" id="zp-new" class="zp-primary"><span aria-hidden="true">＋</span> Новий візит</button></footer>
    </section>

    <section id="zp-editor-view" hidden>
      <header class="zp-editor-header"><button type="button" id="zp-back" class="zp-back">‹ Календар</button><span id="zp-editor-status" class="zp-pill">Чернетка</span></header>
      <form id="zp-form" novalidate>
        <div class="zp-form-intro"><h2 id="zp-editor-title">Новий візит</h2><span class="zp-caption">* Обов’язкові поля</span></div>
        <section class="zp-section">
          <label class="zp-field">Дата *<input id="zp-date" type="date" required></label>
          <div class="zp-two">
            <label class="zp-field">Початок *<input id="zp-start" type="time" required></label>
            <label class="zp-field">Завершення *<input id="zp-end" type="time" required></label>
          </div>
          <div class="zp-duration"><span id="zp-duration">Укажіть час завершення</span><button type="button" id="zp-use-duration" class="zp-text-button" hidden>За послугами</button></div>
        </section>
        <section class="zp-section">
          <h3>Клієнт</h3>
          <label class="zp-field">Клієнтська база<select id="zp-client-select"><option value="">Новий клієнт</option></select></label>
          <label class="zp-field">Ім’я *<input id="zp-name" type="text" maxlength="80" autocomplete="off" placeholder="Ім’я клієнта" required></label>
          <label class="zp-field">Телефон *<input id="zp-phone" type="tel" maxlength="24" autocomplete="off" placeholder="+380 …" required></label>
          <details class="zp-extra"><summary>Прізвище, по батькові та примітка</summary>
            <div class="zp-two"><label class="zp-field">Прізвище<input id="zp-surname" type="text" maxlength="100" autocomplete="off"></label><label class="zp-field">По батькові<input id="zp-patronymic" type="text" maxlength="100" autocomplete="off"></label></div>
            <label class="zp-field">Примітка про клієнта<textarea id="zp-client-note" rows="2" maxlength="2000"></textarea></label>
          </details>
        </section>
        <section class="zp-section zp-services-section">
          <div class="zp-section-heading"><h3>Послуги</h3><span id="zp-service-count" class="zp-pill">0 / 5</span></div>
          <div id="zp-services"></div>
          <label class="zp-field">Додати послугу<select id="zp-service-select"><option value="">Виберіть зі списку</option></select></label>
          <div id="zp-service-limit" class="zp-field-hint" hidden>У візиті вже 5 послуг</div>
          <button type="button" id="zp-new-service" class="zp-text-button">＋ Нова послуга</button>
          <div id="zp-new-service-fields" class="zp-new-service-fields" hidden>
            <label class="zp-field">Назва послуги *<input id="zp-service-name" type="text" maxlength="120" placeholder="Наприклад, консультація"></label>
            <div class="zp-two"><label class="zp-field">Тривалість, хв<input id="zp-service-duration" type="number" min="1" max="1440" placeholder="Не вказано"></label><label class="zp-field">Ціна, грн<input id="zp-service-price" type="number" min="0" step="0.01" placeholder="Не вказано"></label></div>
            <label class="zp-field">Текстова примітка<textarea id="zp-service-note" maxlength="2000" rows="2"></textarea></label>
            <div id="zp-new-service-error" class="zp-error" role="alert" hidden></div>
            <div class="zp-inline-actions"><button type="button" id="zp-add-service" class="zp-small-button">Додати до візиту</button><button type="button" id="zp-cancel-service" class="zp-text-button">Скасувати</button></div>
          </div>
          <div id="zp-total" class="zp-total" hidden></div>
        </section>
        <div id="zp-form-error" class="zp-error zp-form-error" role="alert" hidden></div>
        <div class="zp-editor-actions"><button type="button" class="zp-primary" id="zp-save">Зберегти візит</button><button type="button" id="zp-delete" class="zp-delete" hidden>Видалити візит</button></div>
      </form>
    </section>
    <div id="zp-toast" class="zp-toast" role="status" aria-live="polite" hidden></div>
    <div id="zp-announcement" class="zp-sr" aria-live="polite"></div>
  </div>
</div>
<style>

  #zapys-calendar-preview .zp-primary span {font-size:21px;line-height:1;}
  #zapys-calendar-preview .zp-editor-header {display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--zp-line);}
  #zapys-calendar-preview .zp-back {border:0;background:transparent;padding:8px 0;min-height:40px;color:var(--zp-primary);font-weight:500;}
  #zapys-calendar-preview .zp-pill {font-size:11px;border-radius:20px;padding:4px 9px;background:var(--zp-bg);color:var(--zp-muted);white-space:nowrap;}

<script>
(() => {
  const root=document.getElementById('zapys-calendar-preview');
  const el=id=>root.querySelector('#'+id);
  const clone=value=>JSON.parse(JSON.stringify(value));
  const demoToday='2026-11-02';
  const HOUR_HEIGHT=72;
  const PX=HOUR_HEIGHT/60;
  const clients=[
    {id:'c1',name:'Олена',surname:'Коваль',patronymic:'',phone:'+380000000001',note:''},
    {id:'c2',name:'Ірина',surname:'Мельник',patronymic:'',phone:'+380000000002',note:''},
    {id:'c3',name:'Марія',surname:'Бондар',patronymic:'',phone:'+380000000003',note:''}
  ];
  const catalog=[
    {id:'s1',name:'Стрижка',duration:45,price:600,note:''},
    {id:'s2',name:'Фарбування',duration:90,price:1600,note:''},
    {id:'s3',name:'Укладка',duration:30,price:450,note:''},
    {id:'s4',name:'Догляд',duration:30,price:400,note:''},
    {id:'s5',name:'Масаж голови',duration:15,price:250,note:''},
    {id:'s6',name:'Консультація',duration:null,price:null,note:''}
  ];
  let events=[
    {id:'a1',date:demoToday,start:570,end:630,client:clone(clients[0]),services:[clone(catalog[0])],draft:false},
    {id:'a2',date:demoToday,start:720,end:765,client:clone(clients[1]),services:[clone(catalog[2])],draft:false},
    {id:'a3',date:demoToday,start:900,end:990,client:clone(clients[2]),services:[clone(catalog[1])],draft:false}
  ];
  let currentDate=demoToday,weekStart=monday(demoToday),selectedId=null,editing=null,editingExisting=false,manualEnd=false,rangeStart=540,rangeEnd=1080,sequence=10,toastTimer;
  function parseDate(s){return new Date(s+'T12:00:00Z');}
  function dateString(d){return d.toISOString().slice(0,10);}
  function addDays(s,n){const d=parseDate(s);d.setUTCDate(d.getUTCDate()+n);return dateString(d);}
  function monday(s){return addDays(s,-((parseDate(s).getUTCDay()+6)%7));}
  function time(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
  function minute(s){if(!s||!/^\d{2}:\d{2}$/.test(s))return null;const [h,m]=s.split(':').map(Number);return h<24&&m<60?h*60+m:null;}
  function money(n){return new Intl.NumberFormat('uk-UA',{maximumFractionDigits:2}).format(n)+' грн';}
  function durationLabel(n){return n>=60?Math.floor(n/60)+' год'+(n%60?' '+n%60+' хв':''):n+' хв';}

  function button(text,className){const b=document.createElement('button');b.type='button';b.textContent=text;if(className)b.className=className;return b;}
  function getSelected(){return events.find(x=>x.id===selectedId);}
  function showCalendar(){el('zp-editor-view').hidden=true;el('zp-calendar-view').hidden=false;render();}
  function render(){renderWeek();renderCalendar();renderSelection();}
  function renderWeek(){

    const dayTitle=new Intl.DateTimeFormat('uk-UA',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(d);el('zp-day-title').textContent=dayTitle.charAt(0).toUpperCase()+dayTitle.slice(1);
    const weekdays=['ПН','ВТ','СР','ЧТ','ПТ','СБ','НД'];el('zp-week').replaceChildren();
    for(let i=0;i<7;i++){const date=addDays(weekStart,i),day=parseDate(date);const b=button('','zp-day');b.dataset.date=date;b.setAttribute('aria-pressed',String(date===currentDate));b.setAttribute('aria-label',new Intl.DateTimeFormat('uk-UA',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(day));const w=document.createElement('span');w.textContent=weekdays[i];const n=document.createElement('span');n.textContent=day.getUTCDate();b.append(w,n);b.addEventListener('click',()=>{currentDate=date;selectedId=null;render();});el('zp-week').append(b);}
  }
  function groupLanes(items){
    const sorted=[...items].sort((a,b)=>a.start-b.start||a.end-b.end);let group=[],until=-1;const groups=[];
    sorted.forEach(e=>{if(group.length&&e.start>=until){groups.push(group);group=[];until=-1;}group.push(e);until=Math.max(until,e.end);});if(group.length)groups.push(group);

  }
  function renderCalendar(){
    const items=events.filter(e=>e.date===currentDate);rangeStart=Math.min(540,...items.map(e=>Math.floor(e.start/60)*60));rangeEnd=Math.max(1080,...items.map(e=>Math.ceil(e.end/60)*60));

    for(let t=rangeStart;t<rangeEnd;t+=30){const slot=button('','zp-slot'+(t%60?' zp-half':''));slot.style.height=30*PX+'px';slot.dataset.time=time(t);slot.setAttribute('aria-label','Новий візит о '+time(t));slot.addEventListener('click',ev=>{let start=t;if(ev.detail){const y=ev.clientY-slot.getBoundingClientRect().top;start=t+(y>=15*PX?15:0);}start=Math.min(start,1410);const appointment={id:'a'+sequence++,date:currentDate,start,end:start+30,client:null,services:[],draft:true};events.push(appointment);selectedId=appointment.id;render();announce('Створено чернетку: '+time(start)+'–'+time(start+30));});el('zp-slots').append(slot);}

    });
  }
  function renderSelection(){const e=getSelected();el('zp-selection').hidden=!e||e.date!==currentDate;if(!e)return;el('zp-selection-title').textContent=fullName(e.client);el('zp-selection-time').textContent=time(e.start)+'–'+time(e.end)+' · '+durationLabel(e.end-e.start);el('zp-edit-selection').textContent=e.draft?'Заповнити':'Редагувати';}
  function startResize(ev,event,block,handle){
    if(ev.button!==0)return;ev.preventDefault();ev.stopPropagation();const startY=ev.clientY,originalEnd=event.end,originalManual=event.endManual;let dragged=false;selectedId=event.id;block.classList.add('zp-selected');handle.setPointerCapture(ev.pointerId);renderSelection();

  }
  function openEditor(event){
    editing=clone(event);editingExisting=events.some(e=>e.id===event.id);manualEnd=event.endManual??!event.draft;el('zp-toast').hidden=true;el('zp-form-error').hidden=true;root.querySelectorAll('[aria-invalid]').forEach(n=>n.removeAttribute('aria-invalid'));el('zp-form').reset();el('zp-form').querySelectorAll('details').forEach(d=>d.open=false);el('zp-new-service-fields').hidden=true;el('zp-new-service-error').hidden=true;
    el('zp-date').value=editing.date;el('zp-start').value=time(editing.start);el('zp-end').value=editing.end!==null?time(editing.end):'';
    el('zp-editor-title').textContent=event.draft?'Новий візит':'Візит';el('zp-editor-status').textContent=event.draft?'Чернетка':'Записано';el('zp-delete').hidden=!editingExisting;
    el('zp-client-select').replaceChildren(new Option('Новий клієнт',''));clients.forEach(c=>el('zp-client-select').add(new Option(fullName(c),c.id)));el('zp-client-select').value=editing.client?.id||'';fillClient(editing.client);renderServices();updateTiming();el('zp-calendar-view').hidden=true;el('zp-editor-view').hidden=false;el('zp-editor-title').scrollIntoView({block:'nearest'});
  }
  function fillClient(c){el('zp-name').value=c?.name||'';el('zp-surname').value=c?.surname||'';el('zp-patronymic').value=c?.patronymic||'';el('zp-phone').value=c?.phone||'';el('zp-client-note').value=c?.note||'';}
  function allDurations(){return editing&&editing.services.length>0&&editing.services.every(s=>Number.isFinite(s.duration)&&s.duration>0);}
  function applyServiceDuration(force=false){if(allDurations()&&(!manualEnd||force)){const start=minute(el('zp-start').value);const total=editing.services.reduce((n,s)=>n+s.duration,0);if(start!==null&&start+total<1440){el('zp-end').value=time(start+total);manualEnd=false;}}updateTiming();}
  function updateTiming(){const start=minute(el('zp-start').value),end=minute(el('zp-end').value);el('zp-duration').textContent=start!==null&&end!==null&&end>start?durationLabel(end-start):'Укажіть час завершення після початку';el('zp-use-duration').hidden=!allDurations();}
  function updateServiceSummary(){
    const selected=editing.services;el('zp-service-count').textContent=selected.length+' / 5';el('zp-service-select').disabled=selected.length>=5;el('zp-new-service').disabled=selected.length>=5;el('zp-service-limit').hidden=selected.length<5;el('zp-total').hidden=!selected.length;
    const known=selected.filter(s=>s.price!==null&&Number.isFinite(s.price));const value=known.length?money(known.reduce((n,s)=>n+s.price,0))+(known.length<selected.length?' + не вказано':''):'Не вказано';el('zp-total').replaceChildren();const label=document.createElement('span');label.textContent='Вартість візиту';const total=document.createElement('strong');total.textContent=value;el('zp-total').append(label,total);
    selected.forEach((s,i)=>{const m=el('zp-services').querySelector('[data-service-index="'+i+'"] .zp-service-meta');if(m)m.textContent=(s.duration===null?'Тривалість не вказана':s.duration+' хв')+' · '+(s.price===null?'Ціна не вказана':money(s.price));});updateTiming();
  }
  function field(labelText,type,value,change,settings={}){const label=document.createElement('label');label.className='zp-field';label.append(document.createTextNode(labelText));const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;else input.rows=2;input.value=value===null?'':value;Object.entries(settings).forEach(([k,v])=>input.setAttribute(k,String(v)));input.addEventListener('input',()=>change(input.value));label.append(input);return label;}
  function renderServices(){
    el('zp-services').replaceChildren();el('zp-service-select').replaceChildren(new Option('Виберіть зі списку',''));catalog.forEach(s=>{if(!editing.services.some(x=>x.id===s.id))el('zp-service-select').add(new Option(s.name,s.id));});
    editing.services.forEach((service,index)=>{const box=document.createElement('div');box.className='zp-service';box.dataset.serviceIndex=index;const heading=document.createElement('div');heading.className='zp-service-heading';const title=document.createElement('span');title.className='zp-service-name';title.textContent=service.name;const remove=button('×','zp-icon-button');remove.setAttribute('aria-label','Прибрати послугу '+service.name);remove.addEventListener('click',()=>{editing.services.splice(index,1);renderServices();applyServiceDuration();});heading.append(title,remove);const meta=document.createElement('div');meta.className='zp-service-meta';const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Змінити для цього візиту';const row=document.createElement('div');row.className='zp-two';
      row.append(field('Тривалість, хв','number',service.duration,v=>{service.duration=v===''?null:Number(v);updateServiceSummary();applyServiceDuration();},{min:1,max:1440,placeholder:'Не вказано'}),field('Ціна, грн','number',service.price,v=>{service.price=v===''?null:Number(v);updateServiceSummary();},{min:0,step:'0.01',placeholder:'Не вказано'}));const note=field('Текстова примітка','textarea',service.note,v=>service.note=v,{maxlength:2000});details.append(summary,row,note);box.append(heading,meta,details);el('zp-services').append(box);
    });updateServiceSummary();
  }
  function addService(service){if(editing.services.length>=5){announce('Можна додати не більше 5 послуг');return;}editing.services.push(clone(service));renderServices();applyServiceDuration();}
  function formError(message,id){el('zp-form-error').textContent=message;el('zp-form-error').hidden=false;if(id){el(id).setAttribute('aria-invalid','true');el(id).focus();}}
  function save(ev){
    ev.preventDefault();el('zp-form-error').hidden=true;root.querySelectorAll('[aria-invalid]').forEach(n=>n.removeAttribute('aria-invalid'));
    const date=el('zp-date').value,start=minute(el('zp-start').value),end=minute(el('zp-end').value),name=el('zp-name').value.trim(),phone=el('zp-phone').value.trim();
    if(!date)return formError('Оберіть дату візиту.','zp-date');if(start===null)return formError('Укажіть час початку.','zp-start');if(end===null||end<=start)return formError('Час завершення має бути пізніше початку.','zp-end');if(!name)return formError('Укажіть ім’я клієнта.','zp-name');if(!phone)return formError('Укажіть телефон клієнта.','zp-phone');if(phone.replace(/\D/g,'').length<7)return formError('Перевірте номер телефону.','zp-phone');if(editing.services.length>5)return formError('Додайте не більше 5 послуг.');

    const client={id:el('zp-client-select').value||'c'+sequence++,name,surname:el('zp-surname').value.trim(),patronymic:el('zp-patronymic').value.trim(),phone,note:el('zp-client-note').value};const ci=clients.findIndex(c=>c.id===client.id);if(ci<0)clients.push(clone(client));else clients[ci]=clone(client);
    Object.assign(editing,{date,start,end,client,draft:false,endManual:manualEnd});const at=events.findIndex(e=>e.id===editing.id);if(at<0)events.push(clone(editing));else events[at]=clone(editing);selectedId=editing.id;currentDate=date;weekStart=monday(date);editing=null;showCalendar();toast('Візит збережено');el('zp-day-title').scrollIntoView({block:'nearest'});
  }
  function deleteEvent(id){events=events.filter(e=>e.id!==id);selectedId=null;editing=null;showCalendar();toast('Візит видалено');}
  el('zp-prev').addEventListener('click',()=>{weekStart=addDays(weekStart,-7);currentDate=addDays(currentDate,-7);selectedId=null;render();});
  el('zp-next').addEventListener('click',()=>{weekStart=addDays(weekStart,7);currentDate=addDays(currentDate,7);selectedId=null;render();});
  el('zp-today').addEventListener('click',()=>{currentDate=demoToday;weekStart=monday(currentDate);selectedId=null;render();});
  el('zp-new').addEventListener('click',()=>openEditor({id:'a'+sequence++,date:currentDate,start:600,end:null,client:null,services:[],draft:true}));
  el('zp-back').addEventListener('click',()=>{editing=null;showCalendar();});
  el('zp-edit-selection').addEventListener('click',()=>{const e=getSelected();if(e)openEditor(e);});
  el('zp-remove-selection').addEventListener('click',()=>{const e=getSelected();if(e)deleteEvent(e.id);});
  el('zp-client-select').addEventListener('change',()=>fillClient(clients.find(c=>c.id===el('zp-client-select').value)));
  el('zp-service-select').addEventListener('change',()=>{const service=catalog.find(s=>s.id===el('zp-service-select').value);if(service)addService(service);});
  el('zp-start').addEventListener('input',()=>applyServiceDuration());el('zp-end').addEventListener('input',()=>{manualEnd=true;updateTiming();});el('zp-use-duration').addEventListener('click',()=>applyServiceDuration(true));
  el('zp-new-service').addEventListener('click',()=>{el('zp-new-service-fields').hidden=false;el('zp-new-service-error').hidden=true;el('zp-service-name').focus();});
  el('zp-cancel-service').addEventListener('click',()=>el('zp-new-service-fields').hidden=true);
  el('zp-add-service').addEventListener('click',()=>{
    const name=el('zp-service-name').value.trim(),rawDuration=el('zp-service-duration').value,rawPrice=el('zp-service-price').value;const duration=rawDuration===''?null:Number(rawDuration),price=rawPrice===''?null:Number(rawPrice);let error='';if(!name)error='Укажіть назву послуги.';else if(duration!==null&&(!Number.isFinite(duration)||duration<=0||duration>1440))error='Перевірте тривалість послуги.';else if(price!==null&&(!Number.isFinite(price)||price<0))error='Перевірте ціну.';if(error){el('zp-new-service-error').textContent=error;el('zp-new-service-error').hidden=false;return;}if(editing.services.length>=5)return;
